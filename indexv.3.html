<!DOCTYPE html>
<!-- pipeline-board build: v2-mobile (2026-10-04) -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>techsphere.co — Board Pipeline</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<style>
  @font-face{
    font-family:"SF Pro Display";
    src:url("https://cdn.jsdelivr.net/gh/TORCH-Corp/SF-PRO-FONT@main/font/SF-Pro.woff2") format("woff2"),
        url("https://cdn.statically.io/gh/TORCH-Corp/SF-PRO-FONT@main/font/SF-Pro.woff2") format("woff2");
    font-weight:100 900; font-style:normal; font-display:swap;
  }
  :root{
    --ink:#17191d; --ink-2:#4a505c; --sub:#868c97; --faint:#b9bec7;
    --line:#e8eaee; --line-2:#eff0f3; --soft:#f5f6f8; --col:#f4f5f7;
    --blue:#2f6bf0; --blue-600:#2457d6; --blue-tint:#e8efff;
    --pop:0 12px 32px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.05);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:"SF Pro Display","SF Pro Text","SF Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:#fff; color:var(--ink); -webkit-font-smoothing:antialiased; font-size:14px; letter-spacing:-0.01em;
  }
  button, input, select, textarea{ font:inherit; color:inherit; letter-spacing:inherit; }
  button{ cursor:pointer; touch-action:manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  svg{ display:block; }
  [hidden]{ display:none !important; }
  mark{ background:#fff1b8; color:inherit; border-radius:3px; padding:0 1px; }
  body.is-dragging, body.is-dragging *{ cursor:grabbing !important; user-select:none; -webkit-user-select:none; }
  body.is-dragging .board{ scroll-snap-type:none !important; scroll-behavior:auto; }

  .page{ height:100vh; height:100dvh; overflow:auto; display:flex; flex-direction:column; padding:0 38px; }

  /* ================= HEADER ================= */
  .hdr{ display:flex; align-items:center; height:78px; flex:none; }
  .logo{ width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(160deg,#6d8bff,#3f63f3); box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
  .logo svg{ width:23px; height:23px; }
  .hdr .pop-wrap{ margin-left:auto; }
  .org{ display:flex; align-items:center; gap:11px; padding:6px 8px 6px 6px; border:0; background:none; border-radius:12px; transition:background .15s; }
  .org:hover, .org.on{ background:var(--soft); }
  .org-ava{ width:36px; height:36px; border-radius:50%; background:radial-gradient(circle at 30% 30%, #ff9a6b, #f2553d); }
  .org-name{ font-size:15.5px; font-weight:500; }
  .org svg{ width:16px; height:16px; color:var(--ink-2); transition:transform .25s var(--ease); }
  .org.on svg{ transform:rotate(180deg); }

  /* tabs */
  .tabs{ position:relative; display:flex; gap:6px; border-bottom:1px solid var(--line); flex:none; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ display:flex; align-items:center; gap:9px; height:46px; padding:0 14px 0 0; margin-right:12px; border:0; background:none; font-size:15.5px; color:var(--ink-2); white-space:nowrap; transition:color .2s; }
  .tab svg{ width:19px; height:19px; }
  .tab:hover{ color:var(--ink); }
  .tab.active{ color:var(--ink); }
  .tab-ind{ position:absolute; bottom:-1px; height:2px; background:var(--ink); border-radius:2px; transition:left .38s var(--ease), width .38s var(--ease); }

  /* stats */
  .stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px; margin-top:34px; flex:none; }
  .stat{ position:relative; padding:20px 22px 20px; border:1px solid var(--line); border-radius:18px; }
  .stat-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .stat-l{ font-size:14.5px; color:var(--ink-2); padding-top:3px; }
  .stat-btn{ width:30px; height:30px; flex:none; border:1px solid var(--line); border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--ink); transition:background .15s, transform .1s; }
  .stat-btn:hover, .stat-btn.on{ background:var(--soft); }
  .stat-btn svg{ width:15px; height:15px; transition:transform .25s var(--ease); }
  .stat:hover .stat-btn svg{ transform:translate(1.5px,-1.5px); }
  .stat-row{ display:flex; align-items:center; gap:10px; margin-top:16px; }
  .stat-v{ font-size:35px; font-weight:500; letter-spacing:-.02em; line-height:1; font-variant-numeric:tabular-nums; }
  .delta{ font-size:12.5px; font-weight:500; padding:4px 8px; border-radius:999px; font-variant-numeric:tabular-nums; transition:background .25s, color .25s; }
  .delta.up{ background:#dcf7e6; color:#157f45; }
  .delta.down{ background:#fde1e1; color:#c81e1e; }
  .delta.flat{ background:var(--soft); color:var(--ink-2); }
  .stat-s{ margin-top:16px; font-size:15px; color:var(--sub); }
  .stat-s b{ color:var(--ink); font-weight:600; }
  .stat .pop{ top:58px; right:16px; width:270px; padding:14px; }
  .spark-h{ font-size:13px; color:var(--sub); }
  .spark-v{ font-size:20px; font-weight:500; margin-top:2px; }
  .spark{ width:100%; height:64px; margin-top:10px; }
  .spark-f{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--faint); margin-top:4px; }

  /* toolbar */
  .tb{ display:flex; align-items:center; gap:10px; margin-top:34px; flex:none; flex-wrap:wrap; }
  .search{ display:flex; align-items:center; gap:10px; width:304px; height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; transition:border-color .15s, box-shadow .2s; }
  .search:focus-within{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(47,107,240,.12); }
  .search svg{ width:19px; height:19px; color:var(--sub); flex:none; }
  .search input{ flex:1; min-width:0; border:0; outline:0; background:none; font-size:15px; }
  .search input::placeholder{ color:#a7adb7; }
  .search .clr{ width:22px; height:22px; border:0; border-radius:6px; background:var(--soft); color:var(--ink-2); display:none; align-items:center; justify-content:center; padding:0; }
  .search .clr svg{ width:12px; height:12px; color:inherit; }
  .search.has .clr{ display:flex; }
  .tb-btn{ position:relative; display:inline-flex; align-items:center; gap:9px; height:44px; padding:0 14px; border:1px solid var(--line); border-radius:12px; background:#fff; font-size:15px; color:var(--ink); white-space:nowrap; transition:background .15s, border-color .15s; }
  .tb-btn:hover, .tb-btn.on{ background:var(--soft); }
  .tb-btn svg{ width:19px; height:19px; color:var(--ink-2); }
  .tb-btn .chev{ width:14px; height:14px; margin-left:-3px; transition:transform .25s var(--ease); }
  .tb-btn.on .chev{ transform:rotate(180deg); }
  .tb-btn .cnt{ min-width:19px; height:19px; padding:0 5px; border-radius:999px; background:var(--blue); color:#fff; font-size:11.5px; display:none; align-items:center; justify-content:center; }
  .tb-btn .cnt.show{ display:inline-flex; animation:popIn .3s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn{ from{ transform:scale(.4); } to{ transform:none; } }
  .tb .sp{ flex:1; }
  .btn-pri{ display:inline-flex; align-items:center; gap:9px; height:46px; padding:0 18px; border:0; border-radius:12px; background:var(--blue); color:#fff; font-size:15.5px; white-space:nowrap; transition:background .15s, transform .1s; }
  .btn-pri:hover{ background:var(--blue-600); }
  .btn-pri:active{ transform:scale(.98); }
  .btn-pri svg{ width:18px; height:18px; }

  /* ================= BOARD ================= */
  .area{ flex:1 1 auto; min-height:440px; display:flex; flex-direction:column; margin-top:24px; padding-bottom:28px; transition:opacity .2s ease; }
  .area.swap{ opacity:0; }
  .board{ flex:1; min-height:0; display:flex; gap:20px; overflow-x:auto; overflow-y:hidden; padding-bottom:4px; scrollbar-width:thin; }
  .board::-webkit-scrollbar{ height:8px; }
  .board::-webkit-scrollbar-thumb{ background:#dcdfe5; border-radius:8px; }
  .col{ flex:0 0 calc((100% - 60px) / 4); min-width:292px; display:flex; flex-direction:column; min-height:0; padding:12px 12px 0; background:var(--col); border:1px solid #eceef1; border-radius:22px; transition:background .2s, border-color .2s, box-shadow .2s; }
  .col.over{ background:#eef2fb; border-color:#cfdaf5; box-shadow:inset 0 0 0 1px #cfdaf5; }
  .col-h{ display:flex; align-items:center; gap:10px; padding:11px 12px 11px 16px; background:#fff; border:1px solid #eceef1; border-radius:15px; box-shadow:0 1px 2px rgba(16,24,40,.03); flex:none; }
  .col-dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .col-n{ flex:1; min-width:0; font-size:17px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .col-c{ font-size:13px; color:var(--sub); padding:4px 9px; background:#f2f3f5; border-radius:8px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .col-s{ font-size:13px; font-weight:500; color:var(--blue); padding:4px 9px; background:var(--blue-tint); border-radius:8px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .col-list{ flex:1; min-height:0; overflow-y:auto; padding:12px 0 12px; margin:0 -12px; padding-left:12px; padding-right:12px; scrollbar-width:none; }
  .col-list::-webkit-scrollbar{ display:none; }
  .col-empty{ display:none; align-items:center; justify-content:center; height:96px; border:1.5px dashed #d6dae2; border-radius:14px; color:var(--sub); font-size:13.5px; }
  .col-list.empty .col-empty{ display:flex; }

  .card{ position:relative; display:block; margin-bottom:12px; padding:16px 16px 14px; background:#fff; border:1px solid #eceef1; border-radius:16px; cursor:grab; box-shadow:0 1px 2px rgba(16,24,40,.03);
    transition:border-color .2s, box-shadow .2s, opacity .25s, height .3s var(--ease), padding .3s var(--ease), margin .3s var(--ease); -webkit-touch-callout:none; }
  @media (hover:hover){ .card:hover{ border-color:#dcdfe5; box-shadow:0 6px 16px rgba(16,24,40,.07); } }
  .card.f-hidden{ display:none; }
  .card.placeholder{ background:rgba(47,107,240,.05); border:1.5px dashed #a9bdf3; box-shadow:none; }
  .card.placeholder > *{ visibility:hidden; }
  .card.leaving{ height:0 !important; padding-top:0; padding-bottom:0; margin-bottom:0; opacity:0; border-width:0; overflow:hidden; }
  .card.flash{ animation:flash 1.1s ease; }
  @keyframes flash{ 0%,100%{ box-shadow:0 1px 2px rgba(16,24,40,.03); } 25%{ box-shadow:0 0 0 4px rgba(47,107,240,.25); border-color:var(--blue); } }
  .ghost{ position:fixed; z-index:400; margin:0; pointer-events:none; cursor:grabbing; transition:transform .18s var(--ease), box-shadow .18s, left .22s var(--ease), top .22s var(--ease); }
  .ghost.lift{ transform:rotate(2.2deg) scale(1.03); box-shadow:0 22px 44px rgba(16,24,40,.18), 0 4px 10px rgba(16,24,40,.08); border-color:#d3d8e1; }
  .ghost.moving{ transition:transform .18s var(--ease), box-shadow .18s; }
  .c-top{ display:flex; align-items:flex-start; flex-wrap:wrap; gap:8px 10px; }
  .c-title{ flex:1 1 140px; min-width:0; margin:0; font-size:17px; font-weight:500; line-height:1.32; letter-spacing:-.012em; }
  .badge{ flex:none; display:inline-flex; align-items:center; height:24px; padding:0 9px; border-radius:8px; font-size:12.5px; font-weight:500; white-space:nowrap; }
  .st-ontrack{ background:#dcf7e6; color:#157f45; }
  .st-review{ background:#fdf1c2; color:#8a6400; }
  .st-hold{ background:#ffe9d5; color:#b45309; }
  .st-delayed{ background:#ffe2cf; color:#c2410c; }
  .st-risk{ background:#fde1e1; color:#c81e1e; }
  .st-won{ background:#16a34a; color:#fff; }
  .c-co{ margin-top:6px; font-size:14.5px; color:var(--sub); }
  .c-meta{ display:flex; align-items:center; gap:8px; margin-top:14px; font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums; }
  .c-meta span{ display:inline-flex; align-items:center; gap:7px; }
  .c-meta svg{ width:16px; height:16px; color:#8b919c; }
  .c-meta .sep{ color:var(--faint); font-style:normal; }
  .c-foot{ display:flex; align-items:center; gap:10px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line-2); }
  .ava{ width:28px; height:28px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10.5px; font-weight:600; letter-spacing:0; }
  .c-owner{ flex:1; min-width:0; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more{ width:30px; height:30px; flex:none; border:1px solid var(--line); border-radius:8px; background:#fff; display:flex; align-items:center; justify-content:center; color:var(--ink-2); padding:0; cursor:pointer; transition:background .15s; }
  .more:hover, .more.on{ background:var(--soft); }
  .more svg{ width:16px; height:16px; }

  /* list view */
  .lv{ flex:1; min-height:0; overflow:auto; border:1px solid var(--line); border-radius:18px; }
  .lv table{ width:100%; border-collapse:collapse; min-width:860px; }
  .lv th{ position:sticky; top:0; z-index:1; text-align:left; font-size:13px; font-weight:500; color:var(--sub); padding:13px 16px; background:var(--soft); border-bottom:1px solid var(--line); white-space:nowrap; }
  .lv td{ padding:13px 16px; border-bottom:1px solid var(--line-2); font-size:14.5px; vertical-align:middle; white-space:nowrap; }
  .lv tr.row{ cursor:pointer; transition:background .13s; animation:fadeUp .3s var(--ease) backwards; }
  .lv tr.row:hover{ background:#fafbfc; }
  .lv .t1{ font-weight:500; }
  .lv .t2{ font-size:13px; color:var(--sub); margin-top:2px; }
  .lv .stg{ display:inline-flex; align-items:center; gap:8px; }
  .lv .stg i{ width:8px; height:8px; border-radius:50%; }
  .lv .own{ display:inline-flex; align-items:center; gap:8px; }
  .lv .own .ava{ width:24px; height:24px; font-size:9.5px; }
  .lv-empty{ padding:40px; text-align:center; color:var(--sub); }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  /* placeholder page */
  .ph{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; min-height:420px; text-align:center; transition:opacity .2s ease; }
  .ph.swap{ opacity:0; }
  .ph .e-ic{ width:56px; height:56px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-2); }
  .ph .e-ic svg{ width:24px; height:24px; }
  .ph b{ font-size:18px; font-weight:500; }
  .ph p{ margin:0; color:var(--sub); font-size:14.5px; max-width:360px; line-height:1.5; }
  .ph .btn-pri{ margin-top:8px; height:42px; font-size:14.5px; }

  /* ================= POPOVERS ================= */
  .pop-wrap{ position:relative; }
  .pop{ position:absolute; top:calc(100% + 8px); left:0; z-index:90; min-width:220px; padding:6px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--pop);
    opacity:0; transform:translateY(-6px) scale(.98); transform-origin:top left; pointer-events:none; transition:opacity .16s ease, transform .22s var(--ease); }
  .pop.right{ left:auto; right:0; transform-origin:top right; }
  .pop.open{ opacity:1; transform:none; pointer-events:auto; }
  .pop-t{ padding:8px 10px 6px; font-size:12px; font-weight:500; letter-spacing:.04em; color:var(--sub); text-transform:uppercase; }
  .pi{ display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:0; border-radius:8px; background:none; text-align:left; font-size:14.5px; color:var(--ink-2); transition:background .13s; }
  .pi:hover{ background:var(--soft); color:var(--ink); }
  .pi svg{ width:17px; height:17px; flex:none; color:var(--sub); }
  .pi .chk{ margin-left:auto; color:var(--ink); opacity:0; }
  .pi.sel{ color:var(--ink); }
  .pi.sel .chk{ opacity:1; }
  .pi.danger, .pi.danger svg{ color:#d92d20; }
  .pi .dot{ width:8px; height:8px; border-radius:50%; flex:none; margin:0 4px; }
  .pop-sep{ height:1px; background:var(--line); margin:5px 6px; }
  .cbx{ width:17px; height:17px; flex:none; border:1.6px solid #cfd3da; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; color:#fff; transition:background .15s, border-color .15s; }
  .cbx svg{ width:11px; height:11px; color:#fff; opacity:0; transform:scale(.5); transition:opacity .12s, transform .22s cubic-bezier(.34,1.56,.64,1); }
  .pi.sel .cbx{ background:var(--ink); border-color:var(--ink); }
  .pi.sel .cbx svg{ opacity:1; transform:none; }
  .pop-f{ display:flex; justify-content:space-between; gap:8px; padding:8px 6px 4px; border-top:1px solid var(--line); margin-top:4px; }
  .pop-f button{ height:34px; padding:0 12px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:13.5px; }
  .pop-f button:hover{ background:var(--soft); }
  .menu{ position:fixed; z-index:300; min-width:210px; padding:6px; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--pop);
    opacity:0; transform:scale(.97); pointer-events:none; transition:opacity .14s ease, transform .2s var(--ease); }
  .menu.open{ opacity:1; transform:none; pointer-events:auto; }

  /* AI insights */
  .ai{ width:380px; padding:0; overflow:hidden; }
  .ai-h{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .ai-h .ai-ic{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(140deg,#8b6cff,#3f63f3); }
  .ai-h .ai-ic svg{ width:16px; height:16px; }
  .ai-h b{ font-size:15px; font-weight:500; }
  .ai-h span{ font-size:12.5px; color:var(--sub); display:block; margin-top:1px; }
  .ai-h button{ margin-left:auto; height:30px; padding:0 10px; border:1px solid var(--line); border-radius:8px; background:#fff; font-size:13px; }
  .ai-h button:hover{ background:var(--soft); }
  .ai-b{ padding:10px; display:flex; flex-direction:column; gap:6px; max-height:360px; overflow:auto; }
  .ins{ display:flex; gap:11px; padding:10px; border-radius:10px; animation:fadeUp .35s var(--ease) backwards; }
  .ins:hover{ background:var(--soft); }
  .ins .ii{ width:28px; height:28px; flex:none; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .ins .ii svg{ width:15px; height:15px; }
  .ins p{ margin:0; font-size:14px; line-height:1.45; color:var(--ink-2); }
  .ins p b{ color:var(--ink); font-weight:500; }
  .skel{ height:52px; border-radius:10px; background:linear-gradient(90deg,#f2f3f5 0%,#e8eaee 40%,#f2f3f5 80%); background-size:200% 100%; animation:shimmer 1.1s linear infinite; }
  @keyframes shimmer{ from{ background-position:100% 0; } to{ background-position:-100% 0; } }

  /* ================= DRAWER ================= */
  .scrim{ position:fixed; inset:0; z-index:200; background:rgba(17,19,24,.28); opacity:0; pointer-events:none; transition:opacity .25s ease; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{ position:fixed; top:0; right:0; bottom:0; z-index:210; width:440px; max-width:100%; display:flex; flex-direction:column; background:#fff; box-shadow:none; transform:translateX(100%); visibility:hidden; transition:transform .38s var(--ease), box-shadow .38s, visibility 0s linear .38s; }
  .drawer.open{ transform:none; visibility:visible; box-shadow:-20px 0 50px rgba(16,24,40,.14); transition:transform .38s var(--ease), box-shadow .38s, visibility 0s; }
  .dr-h{ display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); flex:none; }
  .dr-stage{ display:inline-flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-2); }
  .dr-stage i{ width:8px; height:8px; border-radius:50%; }
  .x{ margin-left:auto; width:34px; height:34px; border:0; border-radius:9px; background:none; display:flex; align-items:center; justify-content:center; color:var(--ink); padding:0; }
  .x:hover{ background:var(--soft); }
  .x svg{ width:18px; height:18px; }
  .dr-b{ flex:1; min-height:0; overflow:auto; padding:18px 18px 24px; }
  .dr-title{ width:100%; border:1px solid transparent; border-radius:10px; padding:6px 8px; margin:0 -8px; font-size:22px; font-weight:500; letter-spacing:-.015em; outline:0; background:none; transition:border-color .15s, background .15s; }
  .dr-title:hover{ background:var(--soft); }
  .dr-title:focus{ border-color:var(--blue); background:#fff; }
  .dr-co{ width:100%; border:1px solid transparent; border-radius:8px; padding:4px 8px; margin:2px -8px 0; font-size:15px; color:var(--sub); outline:0; background:none; }
  .dr-co:hover{ background:var(--soft); }
  .dr-co:focus{ border-color:var(--blue); color:var(--ink); background:#fff; }

    setTimeout(function(){ DEALS.splice(DEALS.indexOf(d),1); el.remove(); el.classList.remove('leaving'); el.style.height=''; updateColumns(); updateStats(); if(state.view==='list') renderList(); }, reduce?0:320);
    toast('Deal deleted', 'Undo', function(){ DEALS.splice(Math.min(idx,DEALS.length),0,d); renderBoard(true); updateStats(); flashCard(d); });
  }
  function scrollToCard(d){
    if(state.view!=='kanban') return;
    var col=d.el.closest('.col'); if(!col) return;
    var br=board.getBoundingClientRect(), cr=col.getBoundingClientRect();
    if(cr.left<br.left || cr.right>br.right) board.scrollTo({ left:board.scrollLeft+cr.left-br.left-(window.innerWidth<760?0:20), behavior:reduce?'auto':'smooth' });
    setTimeout(function(){ d.el.scrollIntoView({ block:'nearest', inline:'nearest', behavior:reduce?'auto':'smooth' }); }, 60);
  }
  function flashCard(d){ if(!d.el) return; d.el.classList.remove('flash'); void d.el.offsetWidth; d.el.classList.add('flash'); }

  /* ================= LIST VIEW ================= */
  var lv=$('#lv');
  function renderList(){
    var rows=DEALS.filter(matches).sort(function(a,b){ return STAGES.indexOf(stage(a.stage))-STAGES.indexOf(stage(b.stage)) || a.order-b.order; });
    if(!rows.length){ lv.innerHTML='<div class="lv-empty">No deals match your filters.</div>'; return; }
    lv.innerHTML='<table><thead><tr><th>Deal</th><th>Stage</th><th>Value</th><th>Close date</th><th>Owner</th><th>Status</th><th></th></tr></thead><tbody>'+
      rows.map(function(d,i){ var s=stage(d.stage); return '<tr class="row" data-id="'+d.id+'" style="animation-delay:'+(Math.min(i,10)*25)+'ms"><td><div class="t1">'+hl(d.title)+'</div><div class="t2">'+hl(d.company)+'</div></td>'+
        '<td><span class="stg"><i style="background:'+s.dot+'"></i>'+s.name+'</span></td><td>'+money(d.value)+'</td><td>'+fmtDate(d.date)+'</td>'+
        '<td><span class="own">'+avaHTML(d.owner)+esc(d.owner)+'</span></td><td>'+badgeHTML(d)+'</td><td><button class="more" aria-label="Deal options">'+ic('more')+'</button></td></tr>'; }).join('')+
      '</tbody></table>';
  }
  lv.addEventListener('click', function(e){
    var row=e.target.closest('.row'); if(!row) return;
    var d=deal(row.dataset.id), more=e.target.closest('.more');
    if(more){ e.stopPropagation(); openMenu(d, more); return; }
    openDrawer(d);
  });

  /* ================= TOOLBAR ================= */
  var sInput=$('#searchInput'), sBox=$('#searchBox'), sT=null;
  sInput.addEventListener('input', function(){ sBox.classList.toggle('has', !!sInput.value); clearTimeout(sT); sT=setTimeout(function(){ state.search=sInput.value.trim(); renderBoard(true); }, 90); });
  $('#searchClr').addEventListener('click', function(e){ e.preventDefault(); sInput.value=''; sBox.classList.remove('has'); state.search=''; renderBoard(true); sInput.focus(); });
  sInput.addEventListener('keydown', function(e){ if(e.key==='Escape'){ sInput.value=''; sBox.classList.remove('has'); state.search=''; renderBoard(true); sInput.blur(); } });

  var area=$('#area');
  $$('[data-view]').forEach(function(b){ b.addEventListener('click', function(){
    closePops(); if(state.view===b.dataset.view) return;
    state.view=b.dataset.view;
    $$('[data-view]').forEach(function(x){ x.classList.toggle('sel', x===b); });
    $('#viewLbl').textContent=state.view==='kanban'?'Kanban View':'List View';
    var vi=$('#viewIc'); var t=document.createElement('div'); t.innerHTML=ic(state.view==='kanban'?'board':'list'); t.firstChild.id='viewIc'; vi.replaceWith(t.firstChild);
    area.classList.add('swap');
    setTimeout(function(){ board.hidden=state.view!=='kanban'; lv.hidden=state.view!=='list'; if(state.view==='list') renderList(); area.classList.remove('swap'); }, reduce?0:180);
  }); });
  $$('[data-pipe]').forEach(function(b){ b.addEventListener('click', function(){
    closePops(); state.pipe=b.dataset.pipe;
    $$('[data-pipe]').forEach(function(x){ x.classList.toggle('sel', x===b); });
    $('#pipeLbl').textContent=b.textContent.trim();
    renderBoard(true);
  }); });

  /* filter */
  var fStatus=$('#fStatus'), fOwner=$('#fOwner');
  var CB='<span class="cbx">'+ic('check')+'</span>';
  fStatus.innerHTML=Object.keys(STATUS).map(function(k){ return '<button class="pi" data-fs="'+k+'">'+CB+'<span class="badge st-'+k+'" style="height:22px">'+STATUS[k]+'</span></button>'; }).join('');
  fOwner.innerHTML=Object.keys(OWNERS).map(function(n){ return '<button class="pi" data-fo="'+esc(n)+'">'+CB+avaHTML(n).replace('class="ava"','class="ava" style="width:22px;height:22px;font-size:9px;background:'+OWNERS[n]+'"')+esc(n)+'</button>'; }).join('');
  function applyFilter(){
    var n=Object.keys(state.fStatus).length+Object.keys(state.fOwner).length, c=$('#filterCnt');
    c.textContent=n; c.classList.toggle('show', n>0);
    renderBoard(true);
  }
  fStatus.addEventListener('click', function(e){ var b=e.target.closest('[data-fs]'); if(!b) return; var k=b.dataset.fs; if(state.fStatus[k]) delete state.fStatus[k]; else state.fStatus[k]=1; b.classList.toggle('sel', !!state.fStatus[k]); applyFilter(); });
  fOwner.addEventListener('click', function(e){ var b=e.target.closest('[data-fo]'); if(!b) return; var k=b.dataset.fo; if(state.fOwner[k]) delete state.fOwner[k]; else state.fOwner[k]=1; b.classList.toggle('sel', !!state.fOwner[k]); applyFilter(); });
  $('#fClear').addEventListener('click', function(){ state.fStatus={}; state.fOwner={}; $$('#pop-filter .pi').forEach(function(b){ b.classList.remove('sel'); }); applyFilter(); });
  $('#fDone').addEventListener('click', function(){ closePops(); });

  /* AI insights */
  function insights(){
    var on=ongoing().filter(matches), out=[];
    var byStage=STAGES.filter(function(s){ return s.id!=='won'; }).map(function(s){ var a=on.filter(function(d){ return d.stage===s.id; }); return { s:s, n:a.length, v:sum(a), avg:a.length?sum(a)/a.length:0 }; });
    var top=byStage.slice().sort(function(a,b){ return b.v-a.v; })[0];
    if(top && top.n) out.push({ i:'trend', c:'#2f6bf0', b:'#e8efff', h:'<b>'+top.s.name+'</b> holds the most value: <b>'+money(top.v)+'</b> across '+top.n+' deal'+(top.n===1?'':'s')+'.' });
    var risky=on.filter(function(d){ return d.status==='risk'||d.status==='delayed'; });
    if(risky.length) out.push({ i:'alert', c:'#c2410c', b:'#ffe9d5', h:'<b>'+risky.length+' deal'+(risky.length===1?' is':'s are')+' at risk or delayed</b> ('+money(sum(risky))+'). Check in with '+risky.map(function(d){ return d.owner.split(' ')[0]; }).filter(function(v,i,a){ return a.indexOf(v)===i; }).join(' and ')+'.' });
    var soon=on.filter(function(d){ var n=daysUntil(d.date); return n>=0 && n<=30; });
    if(soon.length) out.push({ i:'clock', c:'#7c3aed', b:'#f1ebff', h:'<b>'+soon.length+' deal'+(soon.length===1?'':'s')+' close within 30 days</b>, worth '+money(sum(soon))+'. Earliest: '+soon.sort(function(a,b){ return daysUntil(a.date)-daysUntil(b.date); })[0].title+'.' });
    var owners={}; on.forEach(function(d){ owners[d.owner]=(owners[d.owner]||0)+d.value; });
    var lead=Object.keys(owners).sort(function(a,b){ return owners[b]-owners[a]; })[0];
    if(lead) out.push({ i:'user', c:'#157f45', b:'#dcf7e6', h:'<b>'+lead+'</b> owns the largest share of open value ('+money(owners[lead])+').' });
    var hold=on.filter(function(d){ return d.status==='hold' || d.status==='review'; });
    if(hold.length) out.push({ i:'trophy', c:'#8a6400', b:'#fdf1c2', h:'<b>'+hold.length+' deal'+(hold.length===1?' is':'s are')+' waiting on a decision.</b> Unblocking '+(hold.length===1?'it':'them')+' adds '+money(sum(hold))+' of momentum.' });
    if(!out.length) out.push({ i:'sparkle', c:'#2f6bf0', b:'#e8efff', h:'No open deals match your current filters.' });
    return out;
  }
  var aiBody=$('#aiBody');
  function runAI(){
    aiBody.innerHTML='<div class="skel"></div><div class="skel" style="opacity:.8"></div><div class="skel" style="opacity:.6"></div>';
    $('#aiSub').textContent='Analyzing '+ongoing().filter(matches).length+' open deals…';
    setTimeout(function(){
      aiBody.innerHTML=insights().map(function(x,i){ return '<div class="ins" style="animation-delay:'+(i*60)+'ms"><span class="ii" style="background:'+x.b+';color:'+x.c+'">'+ic(x.i)+'</span><p>'+x.h+'</p></div>'; }).join('');
      $('#aiSub').textContent='Based on your current pipeline';
    }, reduce?0:850);
  }
  $('#aiRefresh').addEventListener('click', runAI);

  /* ================= POPOVERS ================= */
  function closePops(except){
    $$('.pop.open').forEach(function(p){ if(p!==except) p.classList.remove('open'); });
    $$('[data-pop].on').forEach(function(b){ if(document.getElementById('pop-'+b.dataset.pop)!==except) b.classList.remove('on'); });
  }
  $$('[data-pop]').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var key=btn.dataset.pop, pop=document.getElementById('pop-'+key), was=pop.classList.contains('open');
      closeMenu(); closePops(pop);
      if(!was){
        if(key==='ai') runAI();
        if(key.indexOf('st-')===0) sparkPop(STATS.filter(function(s){ return 'st-'+s.key===key; })[0]);
      }
      pop.classList.toggle('open', !was); btn.classList.toggle('on', !was);
    });
  });
  $$('.pop').forEach(function(p){ p.addEventListener('click', function(e){ e.stopPropagation(); }); });
  document.addEventListener('click', function(){ closePops(); closeMenu(); });
  window.addEventListener('resize', function(){ closeMenu(); moveTabInd(); });
  board.addEventListener('scroll', closeMenu, { passive:true });
  $$('[data-org]').forEach(function(b){ b.addEventListener('click', function(){ $$('[data-org]').forEach(function(x){ x.classList.toggle('sel', x===b); }); $('#orgName').textContent=b.dataset.org; closePops(); toast('Switched to '+b.dataset.org); }); });
  $$('[data-toast]').forEach(function(b){ b.addEventListener('click', function(){ closePops(); toast(b.dataset.toast); }); });

  /* ================= TABS ================= */
  var tabInd=$('#tabInd');
  function moveTabInd(){ var a=$('.tab.active'); tabInd.style.left=a.offsetLeft+'px'; tabInd.style.width=(a.offsetWidth-14)+'px'; }
  $$('.tab').forEach(function(t){ t.addEventListener('click', function(){
    if(t.classList.contains('active')) return;
    $$('.tab').forEach(function(x){ x.classList.toggle('active', x===t); }); moveTabInd();
    t.scrollIntoView({ inline:'nearest', block:'nearest', behavior:reduce?'auto':'smooth' });
    var toPipe=t.dataset.tab==='Board Pipeline', pp=$('#pagePipeline'), ph=$('#pagePh');
    if(toPipe){ ph.classList.add('swap'); setTimeout(function(){ ph.hidden=true; ph.classList.remove('swap'); pp.style.display='contents'; }, reduce?0:180); }
    else { $('#phTitle').textContent=t.dataset.tab; $('#phIc').innerHTML=$('svg',t).outerHTML; pp.style.display='none'; ph.hidden=false; ph.classList.add('swap'); void ph.offsetWidth; ph.classList.remove('swap'); }
  }); });
  $('#phBack').addEventListener('click', function(){ $('.tab[data-tab="Board Pipeline"]').click(); });

  /* ================= DRAWER ================= */
  var drawer=$('#drawer'), scrim=$('#scrim'), drawerDeal=null;
  function openDrawer(d){
    closeMenu(); closePops(); drawerDeal=d;
    var s=stage(d.stage), draftStage=d.stage, draftStatus=d.status;
    drawer.innerHTML=
      '<div class="dr-h"><span class="dr-stage"><i style="background:'+s.dot+'"></i>'+s.name+'</span><button class="x" id="drClose" aria-label="Close">'+ic('x')+'</button></div>'+
      '<div class="dr-b">'+
        '<input class="dr-title" id="drTitle" value="'+esc(d.title)+'" aria-label="Deal name">'+
        '<input class="dr-co" id="drCo" value="'+esc(d.company)+'" aria-label="Company">'+
        '<div class="dr-sec grid2">'+
          '<div class="fld"><label for="drVal">Deal value</label><div class="money"><span>$</span><input class="inp" id="drVal" inputmode="numeric" value="'+d.value+'"></div></div>'+
          '<div class="fld"><label for="drDate">Close date</label><input class="inp" id="drDate" type="date" value="'+d.date+'"></div>'+
          '<div class="fld"><label for="drOwner">Owner</label><select class="inp" id="drOwner">'+Object.keys(OWNERS).map(function(n){ return '<option'+(n===d.owner?' selected':'')+'>'+n+'</option>'; }).join('')+'</select></div>'+
          '<div class="fld"><label for="drPipe">Pipeline</label><select class="inp" id="drPipe"><option value="product"'+(d.pipe==='product'?' selected':'')+'>Product</option><option value="services"'+(d.pipe==='services'?' selected':'')+'>Services</option></select></div>'+
        '</div>'+
        '<div class="dr-sec"><div class="dr-l">Stage</div><div class="stage-pills" id="drStages">'+STAGES.map(function(x){ return '<button class="sp-btn'+(x.id===d.stage?' on':'')+'" data-s="'+x.id+'"><i style="background:'+x.dot+'"></i>'+x.name+'</button>'; }).join('')+'</div></div>'+
        '<div class="dr-sec"><div class="dr-l">Status</div><div class="st-pills" id="drStatus">'+Object.keys(STATUS).map(function(k){ return '<button class="badge st-'+k+(k===d.status?' on':'')+'" data-st="'+k+'">'+STATUS[k]+'</button>'; }).join('')+'</div></div>'+
        '<div class="dr-sec"><div class="dr-l">Notes</div><textarea class="inp" id="drNotes" placeholder="Add context for your team…">'+esc(d.notes||'')+'</textarea></div>'+
        '<div class="dr-sec"><div class="dr-l">Activity</div><div class="act">'+d.log.map(function(l,i){ return '<div class="act-i" style="animation-delay:'+(i*40)+'ms"><i></i><div>'+esc(l.t)+'<span>'+esc(l.w)+'</span></div></div>'; }).join('')+'</div></div>'+
      '</div>'+
      '<div class="dr-f"><button class="btn danger" id="drDel">Delete</button><span class="sp"></span><button class="btn" id="drCancel">Cancel</button><button class="btn pri" id="drSave">Save changes</button></div>';
    scrim.classList.add('open'); drawer.classList.add('open');
    $('#drClose').addEventListener('click', closeDrawer);
    $('#drCancel').addEventListener('click', closeDrawer);
    $('#drDel').addEventListener('click', function(){ deleteDeal(d); });
    $('#drStages').addEventListener('click', function(e){ var b=e.target.closest('[data-s]'); if(!b) return; draftStage=b.dataset.s; $$('.sp-btn',this).forEach(function(x){ x.classList.toggle('on', x===b); }); });
    $('#drStatus').addEventListener('click', function(e){ var b=e.target.closest('[data-st]'); if(!b) return; draftStatus=b.dataset.st; $$('.badge',this).forEach(function(x){ x.classList.toggle('on', x===b); }); });
    $('#drSave').addEventListener('click', function(){
      var t=$('#drTitle'), v=$('#drVal'), val=parseInt(String(v.value).replace(/[^0-9]/g,''),10);
      if(!t.value.trim()){ t.classList.remove('err'); void t.offsetWidth; t.classList.add('err'); t.focus(); return; }
      if(!val){ v.classList.remove('err'); void v.offsetWidth; v.classList.add('err'); v.focus(); return; }
      var moved=draftStage!==d.stage;
      d.title=t.value.trim(); d.company=$('#drCo').value.trim()||d.company; d.value=val; d.date=$('#drDate').value||d.date;
      d.owner=$('#drOwner').value; d.pipe=$('#drPipe').value; d.status=draftStatus; d.notes=$('#drNotes').value;
      if(moved){ d.stage=draftStage; d.order=-1; d.log.unshift({ t:'Moved to '+stage(draftStage).name, w:'Just now' }); }
      else d.log.unshift({ t:'Details updated', w:'Just now' });
      closeDrawer();
      renderBoard(true); syncOrderFromDOM(); updateStats();
      setTimeout(function(){ scrollToCard(d); flashCard(d); }, 120);
      toast(moved?(d.stage==='won'?'Deal closed: '+d.title+' +'+money(d.value):'Saved and moved to '+stage(d.stage).name):'Changes saved');
    });
    setTimeout(function(){ $('#drClose').focus({ preventScroll:true }); }, 60);
  }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); drawerDeal=null; }
  scrim.addEventListener('click', closeDrawer);

  /* ================= NEW TRANSACTION ================= */
  var overlay=$('#overlay'), modal=$('#modal');
  function closeModal(){ overlay.classList.remove('open'); }
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
  $('#newBtn').addEventListener('click', function(e){
    e.stopPropagation(); closePops(); closeMenu();
    modal.innerHTML=
      '<div class="m-h"><div><h3>New transaction</h3><p>Add a deal to your pipeline.</p></div><button class="x" id="nClose" aria-label="Close">'+ic('x')+'</button></div>'+
      '<div class="m-b">'+
        '<div class="fld"><label for="nTitle">Deal name</label><input class="inp" id="nTitle" placeholder="e.g. CRM Integration" autocomplete="off"></div>'+
        '<div class="fld"><label for="nCo">Company</label><input class="inp" id="nCo" placeholder="e.g. NovaTech Solutions" autocomplete="off"></div>'+
        '<div class="grid2">'+
          '<div class="fld"><label for="nVal">Deal value</label><div class="money"><span>$</span><input class="inp" id="nVal" inputmode="numeric" placeholder="5,000"></div></div>'+
          '<div class="fld"><label for="nDate">Close date</label><input class="inp" id="nDate" type="date" value="2025-06-30"></div>'+
          '<div class="fld"><label for="nStage">Stage</label><select class="inp" id="nStage">'+STAGES.filter(function(s){ return s.id!=='won'; }).map(function(s){ return '<option value="'+s.id+'">'+s.name+'</option>'; }).join('')+'</select></div>'+
          '<div class="fld"><label for="nOwner">Owner</label><select class="inp" id="nOwner">'+Object.keys(OWNERS).map(function(n){ return '<option>'+n+'</option>'; }).join('')+'</select></div>'+
          '<div class="fld"><label for="nStatus">Status</label><select class="inp" id="nStatus">'+Object.keys(STATUS).map(function(k){ return '<option value="'+k+'">'+STATUS[k]+'</option>'; }).join('')+'</select></div>'+
          '<div class="fld"><label for="nPipe">Pipeline</label><select class="inp" id="nPipe"><option value="product">Product</option><option value="services">Services</option></select></div>'+
        '</div>'+
      '</div>'+
      '<div class="m-f"><button class="btn" id="nCancel">Cancel</button><button class="btn pri" id="nCreate">Create transaction</button></div>';
    overlay.classList.add('open');
    setTimeout(function(){ $('#nTitle').focus(); }, 120);
    $('#nClose').addEventListener('click', closeModal);
    $('#nCancel').addEventListener('click', closeModal);
    var valIn=$('#nVal');
    valIn.addEventListener('input', function(){ var n=valIn.value.replace(/[^0-9]/g,''); valIn.value=n?(+n).toLocaleString('en-US'):''; });
    $('#nCreate').addEventListener('click', function(){
      var t=$('#nTitle'), c=$('#nCo'), val=parseInt(valIn.value.replace(/[^0-9]/g,''),10), bad=null;
      [[t,!!t.value.trim()],[c,!!c.value.trim()],[valIn,!!val]].forEach(function(p){ p[0].classList.remove('err'); if(!p[1]){ void p[0].offsetWidth; p[0].classList.add('err'); bad=bad||p[0]; } });
      if(bad){ bad.focus(); return; }
      var d={ id:'d'+Date.now(), title:t.value.trim(), company:c.value.trim(), value:val, date:$('#nDate').value||'2025-06-30', owner:$('#nOwner').value, status:$('#nStatus').value, stage:$('#nStage').value, pipe:$('#nPipe').value, notes:'', order:-1, log:[{ t:'Deal created', w:'Just now' }] };
      DEALS.push(d); buildCard(d);
      closeModal();
      var hidden=!matches(d);
      renderBoard(true); syncOrderFromDOM(); updateStats();
      setTimeout(function(){ scrollToCard(d); flashCard(d); }, 120);
      toast(hidden?'Deal created, but hidden by your filters':'Deal added to '+stage(d.stage).name);
    });
  });

  /* ================= TOAST ================= */
  var toastEl=$('#toast'), toastT=null;
  function toast(msg, action, fn){
    toastEl.innerHTML=ic('check','tic')+'<span'+(action?'':' class="nobtn"')+'>'+esc(msg)+'</span>'+(action?'<button id="toastAct">'+action+'</button>':'');
    toastEl.classList.add('show');
    if(action) $('#toastAct').addEventListener('click', function(e){ e.stopPropagation(); toastEl.classList.remove('show'); fn(); });
    clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.classList.remove('show'); }, action?5000:2400);
  }

  /* ================= KEYS ================= */
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    if(drag){ endDrag(true); return; }
    if(overlay.classList.contains('open')){ closeModal(); return; }
    if(drawer.classList.contains('open')){ closeDrawer(); return; }
    closeMenu(); closePops();
  });

  /* ================= INIT ================= */
  tabInd.style.transition='none'; moveTabInd(); requestAnimationFrame(function(){ tabInd.style.transition=''; });
  renderBoard(false);
  updateStats(true);
  var fr=(document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  fr.then(moveTabInd);
})();
</script>
